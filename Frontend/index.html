<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="preload" as="image" type="image/svg+xml" href="%BASE_URL%Logo/favicon.svg" />
  <link rel="preload" as="image" type="image/png" href="%BASE_URL%Logo/lightLogo.png" />
  <link rel="preload" as="image" type="image/png" href="%BASE_URL%Logo/darkLogo.png" />

  <link rel="icon" type="image/png" href="%BASE_URL%Logo/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%Logo/favicon.svg" />
  <link rel="shortcut icon" href="%BASE_URL%Logo/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%Logo/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Resume Saathi" />
  <link rel="manifest" href="%BASE_URL%Logo/site.webmanifest" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Resume Saathi — ATS Diagnostic & Job Finder</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    html,
    body,
    #root {
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    code, kbd, samp, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    html,
    body {
      margin: 0;
      background-color: #fafafa;
      color: #171717;
    }

    html.dark,
    html.dark body {
      background-color: #141415;
      color: #ededed;
    }
  </style>
  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme") || "system";
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      let useDark = false;

      if (savedTheme === "system") {
        useDark = prefersDark;
      } else if (savedTheme === "dark") {
        useDark = true;
      }

      const initialBg = useDark ? "#141415" : "#fafafa";
      document.documentElement.style.backgroundColor = initialBg;
      if (document.body) {
        document.body.style.backgroundColor = initialBg;
      }

      if (savedTheme === "system") {
        if (prefersDark) {
          document.documentElement.classList.add("dark");
          localStorage.setItem("isDark", true);
        } else {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("isDark", false);
        }
      }
      else if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
        localStorage.setItem("isDark", true);
      }
      else {
        document.documentElement.classList.remove("dark");
        localStorage.setItem("isDark", false);
      }
    })();
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
